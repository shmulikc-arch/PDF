<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מילוי טפסי PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#23251f; --muted:#6d6f66; --line:#e3e0d6; --accent:#2f5d8a; --accent-soft:#e7eef6; --warn:#9a4b2f; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Heebo", system-ui, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:18px 14px 150px; }
  header h1 { font-size:24px; margin:10px 0 2px; letter-spacing:-.01em; }
  header p { margin:0; color:var(--muted); font-size:14.5px; }
  #upload { margin-top:22px; }
  .drop { display:block; border:2px dashed #c9c5b6; border-radius:18px; background:var(--card); padding:38px 18px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop b { display:block; font-size:19px; margin-bottom:6px; }
  .drop span { color:var(--muted); font-size:14.5px; }
  .drop .btn { display:inline-block; margin-top:16px; background:var(--accent); color:#fff; border-radius:12px; padding:11px 22px; font-weight:500; }
  #upload.busy .drop { opacity:.55; pointer-events:none; }
  .privacy { margin:14px 4px 0; font-size:13.5px; color:var(--muted); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; }
  .top .fn { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top small { color:var(--muted); display:block; font-weight:400; }
  .ghost { font:inherit; font-size:14px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:7px 12px; cursor:pointer; white-space:nowrap; color:var(--ink); }
  .progress { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 2px; }
  .bar { height:5px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .progress small { color:var(--muted); font-size:12.5px; }
  section.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 16px 6px; margin:14px 0; }
  section.card h2 { font-size:17px; margin:0 0 4px; color:var(--accent); }
  .note { color:var(--muted); font-size:14px; margin:0 0 8px; }
  .f { padding:12px 0; border-top:1px solid var(--line); }
  section.card h2 + .f { border-top:0; }
  .f .lbl { font-weight:500; margin-bottom:6px; font-size:15.5px; }
  .f.trow { padding:8px 0; }
  .f.trow .lbl { font-weight:400; font-size:15px; }
  .tablehint { font-size:13px; color:var(--muted); margin-bottom:6px; }
  canvas.snip { display:block; max-width:100%; height:auto; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:#fff; }
  input[type=text], textarea { width:100%; font:inherit; color:inherit; background:#fbfaf7; border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none; }
  input[type=text]:focus, textarea:focus { border-color:var(--accent); background:#fff; }
  textarea { min-height:80px; resize:vertical; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; }
  .pill { border:1px solid var(--line); background:#fbfaf7; color:var(--ink); font:inherit; font-size:15px; padding:8px 14px; border-radius:99px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; text-align:start; -webkit-tap-highlight-color:transparent; }
  .pill::before { content:""; width:15px; height:15px; border:1.5px solid #b9b6aa; border-radius:4px; flex:none; }
  .pill.radio::before { border-radius:50%; }
  .pill.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .pill.on::before { border-color:#fff; background:#fff; box-shadow:inset 0 0 0 3px var(--accent); }
  .sig { border:1px dashed #b9b6aa; border-radius:12px; background:#fbfaf7; position:relative; }
  .sig canvas { display:block; width:100%; height:150px; touch-action:none; border-radius:12px; }
  .sig .hint { position:absolute; inset:0; display:grid; place-items:center; color:#b0ad9f; pointer-events:none; }
  .linkbtn { background:none; border:0; color:var(--accent); font:inherit; font-size:14px; padding:6px 0; cursor:pointer; text-decoration:underline; }
  .dock { position:fixed; inset:auto 0 0 0; background:rgba(246,244,239,.96); border-top:1px solid var(--line); padding:12px 14px calc(12px + env(safe-area-inset-bottom)); z-index:10; }
  .dock .in { max-width:760px; margin:0 auto; }
  .go { width:100%; font:inherit; font-weight:700; font-size:17px; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:14px; cursor:pointer; }
  .go:disabled { opacity:.6; cursor:wait; }
  .result { display:none; background:var(--card); border:1px solid var(--accent); border-radius:16px; padding:16px; margin:14px 0; }
  .result.show { display:block; }
  .result h3 { margin:0 0 10px; color:var(--accent); font-size:18px; }
  .acts { display:grid; gap:8px; }
  .act { display:block; text-align:center; font:inherit; font-weight:500; font-size:16px; padding:13px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:#fff; text-decoration:none; cursor:pointer; }
  .act.sec { background:#fff; color:var(--accent); }
  .msg { font-size:14px; margin:12px 4px 0; min-height:1em; }
  .msg.err { color:var(--warn); } .msg.ok { color:var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>מילוי טפסי PDF</h1>
    <p>מעלים טופס, עונים על השאלות, ומורידים את אותו PDF כשהוא מלא.</p>
  </header>

  <div id="upload">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <b>בחירת קובץ PDF</b>
      <span>או גרירת הקובץ לכאן</span><br>
      <span class="btn">בחירת קובץ</span>
    </label>
    <p class="privacy">הקובץ לא נשמר ולא נשלח לשום מקום. הכול קורה בדפדפן שלכם, וכשסוגרים את הדף הכול נמחק.</p>
  </div>

  <div id="work" hidden>
    <div class="top">
      <div class="fn"><span id="fname"></span><small id="summary"></small></div>
      <button type="button" class="ghost" id="again">קובץ אחר</button>
    </div>
    <div class="progress"><div class="bar"><i id="bar"></i></div><small id="ptext"></small></div>
    <div id="form"></div>
    <div class="result" id="result"><h3>הקובץ מוכן ✓</h3><div class="acts" id="acts"></div></div>
  </div>
  <p class="msg" id="msg"></p>
</div>
<div class="dock" id="dock" hidden><div class="in"><button type="button" class="go" id="go">הפקת PDF מלא</button></div></div>

<script src="pdf.min.js"></script>
<script src="pdf-lib.min.js"></script>
<script src="fontkit.umd.min.js"></script>
<script src="font.js"></script>
<script src="detect.js"></script>
<script src="fill.js"></script>
<script src="app.js"></script>
</body>
</html>
